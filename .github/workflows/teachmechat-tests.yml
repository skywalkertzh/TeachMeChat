name: teachmechat tests

on:
  push:
    paths:
      - 'teachmechat/**'
      - 'release.py'
      - '.github/workflows/teachmechat-tests.yml'
  pull_request:
    paths:
      - 'teachmechat/**'
      - 'release.py'
      - '.github/workflows/teachmechat-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: teachmechat/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r teachmechat/requirements.txt
      - name: Run synthetic tests
        run: python -m teachmechat --test
